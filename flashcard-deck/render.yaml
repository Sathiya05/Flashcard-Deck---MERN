services:
  - type: web
    name: flashcard-deck
    runtime: node
    plan: free
    rootDir: flashcard-deck
    autoDeploy: true

    buildCommand: cd client && npm install && npm run build && cd ../server && npm install

    startCommand: node server/index.js

    envVars:
      - key: NODE_ENV
        value: production

      - key: JWT_SECRET
        generateValue: true

      - key: MONGODB_URI
        sync: false